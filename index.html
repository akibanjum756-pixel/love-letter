<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07030d">
<title>A Little Secret ❤️</title>
<!-- Confetti Library -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--pink:#ff4f9a;--hot:#ff176d;--purple:#7c3cff;--glass:rgba(255,255,255,.095)}
html,body{width:100%;min-height:100%;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif}
body{
 min-height:100svh;display:grid;place-items:center;overflow:hidden;padding:12px;color:#fff;
 background:
 radial-gradient(circle at 10% 10%,rgba(255,48,133,.25),transparent 28%),
 radial-gradient(circle at 90% 90%,rgba(124,60,255,.22),transparent 30%),
 linear-gradient(145deg,#050208,#200014 45%,#080311);
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:radial-gradient(#fff .6px,transparent .6px);background-size:34px 34px}
.aurora{position:fixed;inset:-25%;pointer-events:none;filter:blur(70px);opacity:.18;background:conic-gradient(from 0deg,#ff277d,#742dff,#ff277d);animation:aurora 18s linear infinite}
.glow{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;opacity:.24}
.g1{width:220px;height:220px;background:#ff1f78;top:-100px;left:-80px;animation:drift 9s ease-in-out infinite alternate}
.g2{width:260px;height:260px;background:#6d35ff;right:-100px;bottom:-100px;animation:drift 11s ease-in-out infinite alternate-reverse}

/* --- STEP 1: LINK GENERATOR --- */
.generator-screen {
  position: relative;
  z-index: 20;
  width: min(420px, 100%);
  padding: 30px 20px;
  text-align: center;
  border: 1px solid rgba(255,255,255,.18);
  border-radius: 28px;
  background: linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035));
  backdrop-filter: blur(28px);
  -webkit-backdrop-filter: blur(28px);
  box-shadow: 0 20px 60px rgba(0,0,0,.65);
}

.generator-screen h2 { font-size: 22px; margin-bottom: 8px; color: #ffb8d1; }
.generator-screen p { font-size: 13px; color: rgba(255, 255, 255, 0.7); margin-bottom: 20px; }
.input-box { display: flex; flex-direction: column; gap: 12px; }
.input-box input, .input-box textarea { width: 100%; padding: 12px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.4); color: #fff; font-size: 14px; text-align: center; outline: none; font-family: inherit; }
.input-box textarea { height: 90px; resize: none; text-align: left; border-radius: 16px; line-height: 1.4; }
.input-box textarea::placeholder { color: rgba(255, 255, 255, 0.5); }
.input-box input:focus, .input-box textarea:focus { border-color: #ff6da7; }
.gen-btn { background: linear-gradient(135deg,#ff65a7,#ff176d); color: #fff; font-size: 15px; font-weight: 700; padding: 12px 30px; border-radius: 20px; border: 0; cursor: pointer; box-shadow: 0 6px 20px rgba(255,23,109,.4); margin-top: 5px; }
.link-result { display: none; margin-top: 15px; flex-direction: column; gap: 8px; }
.copy-btn { background: #25D366; color: #fff; padding: 10px; border-radius: 15px; border: none; font-weight: bold; cursor: pointer; }

/* --- ENVELOPE CONTAINER --- */
.envelope-container { position: relative; width: min(680px, 100%); min-height: 420px; display: none; flex-direction: column; align-items: center; justify-content: center; perspective: 1000px; opacity: 0; transition: opacity 0.8s ease; }
.envelope-container.show { display: flex; opacity: 1; }
.envelope-wrapper { position: relative; width: 320px; height: 220px; cursor: pointer; z-index: 10; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.8s ease; will-change: transform, opacity; }
.envelope { position: absolute; inset: 0; background: #ff3377; border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.6); transform-style: preserve-3d; }
.envelope .lid { position: absolute; top: 0; left: 0; width: 0; height: 0; border-left: 160px solid transparent; border-right: 160px solid transparent; border-top: 120px solid #ff176d; transform-origin: top center; transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1); z-index: 4; will-change: transform; }
.envelope .pocket { position: absolute; inset: 0; background: linear-gradient(135deg, #ff4f9a, #e6005c); clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); border-radius: 0 0 16px 16px; z-index: 3; }
.envelope .heart-seal { position: absolute; top: 100px; left: 50%; transform: translate(-50%, -50%); font-size: 32px; z-index: 5; transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3)); }
.envelope-sender { position: absolute; bottom: 12px; right: 16px; z-index: 6; font-size: 11px; font-weight: 600; color: rgba(255, 255, 255, 0.9); background: rgba(0, 0, 0, 0.2); padding: 4px 10px; border-radius: 12px; backdrop-filter: blur(4px); border: 1px solid rgba(255, 255, 255, 0.15); letter-spacing: 0.5px; }
.click-hint { margin-top: 25px; font-size: 14px; color: #ffb8d1; letter-spacing: 1px; animation: pulse 1.5s infinite ease-in-out; transition: opacity 0.4s ease; }
.envelope-wrapper.open-flap .lid { transform: rotateX(180deg); }
.envelope-wrapper.open-flap .heart-seal, .envelope-wrapper.open-flap .envelope-sender { opacity: 0; transition: opacity 0.3s ease; }
.envelope-wrapper.fade-out { opacity: 0; transform: translateY(60px) scale(0.8); pointer-events: none; }

/* --- CARD / LETTER STYLES --- */
.card{ position: relative; z-index: 15; width: min(680px, 100%); padding: 28px 20px 22px; text-align: center; border: 1px solid rgba(255,255,255,.18); border-radius: 28px; background: linear-gradient(145deg,rgba(255,255,255,.13),rgba(255,255,255,.035)); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px); box-shadow: 0 20px 60px rgba(0,0,0,.65), inset 0 1px rgba(255,255,255,.22); opacity: 0; transform: translateY(80px) scale(0.85); pointer-events: none; transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1); display: none; }
.card.unfold-show { display: block; opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
.card:after{content:"";position:absolute;inset:0;border-radius:28px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.08),transparent 30%,transparent 70%,rgba(255,70,150,.08))}
.content{position:relative;z-index:2}
.topline{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#ffb8d1;margin-bottom:12px}
.orbit{width:96px;height:96px;margin:0 auto 15px;display:grid;place-items:center;position:relative;border-radius:50%;background:radial-gradient(circle,rgba(255,61,139,.23),transparent 68%);border:1px solid rgba(255,255,255,.14);box-shadow:0 0 45px rgba(255,38,125,.25);animation:float 4s ease-in-out infinite}
.orbit:before,.orbit:after{content:"";position:absolute;border-radius:50%;border:1px solid rgba(255,150,195,.25)}
.orbit:before{inset:6px;animation:spin 8s linear infinite}
.orbit:after{inset:16px;border-style:dashed;animation:spin 12s linear infinite reverse}
.heart{font-size:48px;filter:drop-shadow(0 0 16px rgba(255,50,130,.8));animation:beat 1.8s ease-in-out infinite}
.badge{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border-radius:99px;border:1px solid rgba(255,180,205,.17);background:rgba(255,85,150,.06);font-size:10px;letter-spacing:1.4px;color:#ffc7da;text-transform:uppercase;font-weight:800}
.dot{width:5px;height:5px;border-radius:50%;background:#ff6da7;box-shadow:0 0 8px #ff6da7}
h1{font-size:clamp(36px,8.5vw,60px);line-height:1;letter-spacing:-1.5px;margin:14px 0 12px;background:linear-gradient(100deg,#fff,#ff9fc5,#fff);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}

/* Typewriter CSS */
.message{max-width:500px;margin:auto;color:#f9dce8;font-size:15px;line-height:1.65;min-height:90px;white-space:pre-line}
.cursor{display:inline-block;width:2px;height:16px;background-color:#ff6da7;margin-left:2px;animation:blink .7s infinite}

.question{margin:18px 0;font-size:clamp(20px,4.8vw,28px);line-height:1.3;opacity:0;transition:opacity 1s ease}
.question.show{opacity:1}
.question span{filter:drop-shadow(0 0 8px rgba(255,70,140,.65))}

.buttons{position:relative;display:flex;justify-content:center;align-items:center;gap:12px;min-height:60px;width:100%;touch-action:none}
button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;font-weight:850;border-radius:999px;padding:12px 24px;font-size:15px;transition:transform .2s ease, box-shadow .2s ease;user-select:none;-webkit-tap-highlight-color:transparent}
#yesBtn{color:#fff;background:linear-gradient(135deg,#ff65a7,#ff176d);box-shadow:0 10px 28px rgba(255,23,109,.4),inset 0 1px rgba(255,255,255,.45);z-index:2}
#yesBtn:active{transform:scale(.95)}

/* Update NO Button CSS for smooth moving */
#noBtn{color:#351526;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.24);position:relative;z-index:999;will-change:transform, left, top;transition: left 0.4s cubic-bezier(0.25, 1, 0.5, 1), top 0.4s cubic-bezier(0.25, 1, 0.5, 1);}

/* --- REACTION BAR --- */
.reaction-bar { display: flex; justify-content: center; gap: 10px; margin-top: 15px; opacity: 0; transition: opacity 1s ease; }
.reaction-bar.show { opacity: 1; }
.react-btn { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 50%; width: 40px; height: 40px; font-size: 18px; cursor: pointer; display: grid; place-items: center; transition: transform 0.2s ease, background 0.2s ease; padding: 0; }
.react-btn:hover { transform: scale(1.2); background: rgba(255, 255, 255, 0.25); }
.react-btn:active { transform: scale(0.9); }

.overlay{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:rgba(4,0,8,.9);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.overlay.show{display:grid;animation:fade .5s ease}
.success{width:min(500px,100%);padding:28px 20px 24px;text-align:center;border-radius:28px;border:1px solid rgba(255,255,255,.17);background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.045));box-shadow:0 25px 80px rgba(0,0,0,.65);animation:pop .7s cubic-bezier(.2,.8,.2,1)}
.success .orbit{width:90px;height:90px;margin-bottom:15px}
.success h2{font-size:clamp(32px,7.5vw,50px);line-height:1;margin-bottom:12px;background:linear-gradient(90deg,#fff,#ff9fc4,#fff);background-size:220% auto;-webkit-background-clip:text;color:transparent;animation:shine 3s linear infinite;min-height:56px}
.success p{font-size:16px;line-height:1.6;color:#ffe3ed;min-height:50px;white-space:pre-line}
.signature{margin-top:16px;font-size:11px;color:rgba(255,220,235,.5);opacity:0;transition:opacity 1s ease}
.signature.show{opacity:1}

.custom-msg-box{margin-top:20px;display:flex;flex-direction:column;gap:10px;align-items:center;opacity:0;transition:opacity 1s ease}
.custom-msg-box.show{opacity:1}
.custom-msg-box textarea{width:100%;max-width:380px;height:80px;padding:12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.3);color:#fff;font-family:inherit;font-size:14px;resize:none;outline:none}
.custom-msg-box textarea::placeholder{color:rgba(255,255,255,.5)}
.send-btn{background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-size:14px;padding:10px 24px;border-radius:20px;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(37,211,102,.3)}
.send-btn:active{transform:scale(.96)}

/* NEW ANIMATIONS FOR PARTICLES AND EMOJIS */
@keyframes emojiFloat {
  0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
  10% { opacity: 1; transform: translateY(-10vh) scale(1.2) rotate(10deg); }
  100% { transform: translateY(-110vh) scale(1) rotate(360deg); opacity: 0; }
}

@keyframes bgFloatParticle {
  0% { transform: translateY(10vh) scale(0.5); opacity: 0; }
  20% { opacity: 0.5; }
  100% { transform: translateY(-100vh) scale(1.2); opacity: 0; }
}

@keyframes pulse{0%,100%{opacity:0.6;transform:scale(1)}50%{opacity:1;transform:scale(1.04)}}
@keyframes blink{50%{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(15px) scale(.9)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.06)}60%{transform:scale(1)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shine{to{background-position:220% center}}
@keyframes drift{to{transform:translate(40px,30px) scale(1.1)}}

@media(max-width:480px){
 body{padding:8px}
 .envelope-wrapper{width: 280px; height: 190px;}
 .envelope .lid{border-left-width: 140px; border-right-width: 140px; border-top-width: 105px;}
 .card{padding:22px 14px 18px;border-radius:24px}
 .orbit{width:80px;height:80px;margin-bottom:12px}
 .heart{font-size:40px}
 h1{font-size:34px}
 .message{font-size:14px;line-height:1.55}
 .question{font-size:19px;margin:14px 0}
 button{padding:11px 20px;font-size:14px}
 .success{padding:22px 14px 18px}
}
</style>
</head>
<body>
<div class="aurora"></div><div class="glow g1"></div><div class="glow g2"></div>

<!-- STEP 1: LINK GENERATOR -->
<div class="generator-screen" id="generatorScreen">
  <h2>Create Love Letter Link ✨</h2>
  <p>Enter details & customize your message</p>
  <div class="input-box">
    <input type="text" id="keyInput" placeholder="Enter Secret Access Key 🔑">
    <input type="text" id="toInput" placeholder="To: Recipient Name">
    <input type="text" id="fromInput" placeholder="From: Your Name">
    <input type="text" id="waInput" placeholder="WhatsApp Number">
    <textarea id="customMsgInput" placeholder="Write a message for her/him or leave empty for default message..."></textarea>
    <button class="gen-btn" id="genBtn" onclick="generateLink()">Generate Link 🔗</button>
  </div>
  
  <div class="link-result" id="linkResult">
    <input type="text" id="generatedUrl" readonly>
    <button class="copy-btn" onclick="copyGeneratedLink()">Copy Link 📋</button>
  </div>
</div>

<!-- STEP 2: ENVELOPE & LETTER CONTAINER -->
<div class="envelope-container" id="envelopeContainer">
  <div class="envelope-wrapper" id="envelopeWrapper">
    <div class="envelope">
      <div class="lid"></div>
      <div class="pocket"></div>
      <div class="heart-seal">💌</div>
      <div class="envelope-sender" id="envelopeSender">Sent by ...</div>
    </div>
  </div>
  <div class="click-hint" id="clickHint">Click to open your letter ✨</div>

  <main class="card" id="mainCard">
   <div class="content">
    <div class="topline">A tiny secret for Youuuuuuu</div>
    <div class="orbit"><div class="heart">❤️</div></div>
    <div class="badge"><i class="dot"></i> Something special <i class="dot"></i></div>
    <h1 id="greetingTitle">Hey Special Someone</h1>
    <p class="message"><span id="typedText"></span><span class="cursor" id="cursor"></span></p>
    <h2 class="question" id="questionText">Will you be mine forever? <span>💍❤️</span></h2>
    
    <div class="buttons">
     <button id="yesBtn">YES! ❤️</button>
     <button id="noBtn">No</button>
    </div>

    <div class="reaction-bar" id="reactionBar">
      <button class="react-btn" onclick="sendReaction('🥰')">🥰</button>
      <button class="react-btn" onclick="sendReaction('💖')">💖</button>
      <button class="react-btn" onclick="sendReaction('💍')">💍</button>
      <button class="react-btn" onclick="sendReaction('✨')">✨</button>
      <button class="react-btn" onclick="sendReaction('💋')">💋</button>
    </div>
   </div>
  </main>
</div>

<!-- STEP 3: SUCCESS OVERLAY -->
<section id="successOverlay" class="overlay" aria-hidden="true">
 <div class="success">
  <div class="orbit"><div class="heart">💖</div></div>
  <h2 id="successHeading">I Knew It! ❤️</h2>
  <p><span id="typedSubtext"></span><span class="cursor" id="cursorP"></span></p>

  <div class="custom-msg-box" id="msgBox">
    <textarea id="userMessage" placeholder="Want to say something to me? 💭"></textarea>
    <button class="send-btn" id="sendMsgBtn">Send on WhatsApp 💬</button>
  </div>
  
  <div class="signature" id="signatureText">Yours always 🫶</div>
 </div>
</section>

<script>
// ==========================================
// 🔑 এখানে আপনার পছন্দমত পাসওয়ার্ড বসান
// ==========================================
const CORRECT_KEY = "1234";

let userName = "Special Someone";
let senderName = "Your Name";
let myWhatsAppNumber = "";
let defaultText = "Out of all the people in this world\nmy heart somehow found its home in you 🫠\nI don't want a perfect life—\nI just want a lifetime filled with beautiful moments with you ☺️";
let textToType = defaultText;

const generatorScreen = document.getElementById("generatorScreen");
const envelopeContainer = document.getElementById("envelopeContainer");
const envelopeWrapper = document.getElementById("envelopeWrapper");
const clickHint = document.getElementById("clickHint");
const mainCard = document.getElementById("mainCard");
const greetingTitle = document.getElementById("greetingTitle");
const envelopeSender = document.getElementById("envelopeSender");

const urlParams = new URLSearchParams(window.location.search);
const paramTo = urlParams.get('to');
const paramFrom = urlParams.get('from');
const paramWa = urlParams.get('wa');
const paramMsg = urlParams.get('msg');

if (paramTo && paramWa) {
  userName = paramTo;
  if (paramFrom) senderName = paramFrom;
  myWhatsAppNumber = paramWa;
  if (paramMsg) textToType = decodeURIComponent(paramMsg);

  generatorScreen.style.display = "none";
  greetingTitle.textContent = `Hey ${userName}`;
  envelopeSender.textContent = `Sent by ${senderName}`;
  envelopeContainer.classList.add("show");
  
  // Start Background Particles when letter mode is active
  startBackgroundParticles();
} else {
  generatorScreen.style.display = "block";
}

async function generateLink() {
  const userKey = document.getElementById("keyInput").value.trim();
  
  if (userKey !== CORRECT_KEY) {
    alert("Incorrect Secret Key! ❌ You cannot generate the link.");
    return;
  }

  const toVal = encodeURIComponent(document.getElementById("toInput").value.trim());
  const fromVal = encodeURIComponent(document.getElementById("fromInput").value.trim());
  const waVal = encodeURIComponent(document.getElementById("waInput").value.trim());
  const rawMsg = document.getElementById("customMsgInput").value.trim();
  
  if (!toVal || !waVal) {
    alert("Please fill 'To' name and WhatsApp number!");
    return;
  }

  const msgVal = encodeURIComponent(rawMsg !== "" ? rawMsg : defaultText);

  const genBtn = document.getElementById("genBtn");
  genBtn.disabled = true;
  genBtn.textContent = "Generating Link... ⏳";

  let baseUrl = window.location.href.split('?')[0];
  const shareableUrl = `${baseUrl}?to=${toVal}&from=${fromVal}&wa=${waVal}&msg=${msgVal}`;

  document.getElementById("generatedUrl").value = shareableUrl;
  document.getElementById("linkResult").style.display = "flex";
  
  genBtn.disabled = false;
  genBtn.textContent = "Generate Link 🔗";
}

function copyGeneratedLink() {
  const linkInput = document.getElementById("generatedUrl");
  linkInput.focus(); linkInput.select(); linkInput.setSelectionRange(0, 99999);
  try {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(linkInput.value);
    } else { document.execCommand('copy'); }
    alert("Link copied to clipboard! ❤️");
  } catch(err) { alert("Failed to copy link!"); }
}

/* ENVELOPE OPEN LOGIC */
let envelopeOpened = false;
envelopeWrapper.addEventListener("click", () => {
  if (envelopeOpened) return;
  envelopeOpened = true;
  envelopeWrapper.classList.add("open-flap");
  clickHint.style.opacity = "0";

  setTimeout(() => {
    envelopeWrapper.classList.add("fade-out");
    setTimeout(() => {
      envelopeWrapper.style.display = "none";
      clickHint.style.display = "none";
      mainCard.classList.add("unfold-show");
      startTypewriter();
    }, 600);
  }, 800);
});

/* TYPEWRITER ANIMATION */
function startTypewriter() {
  const typedTextEl = document.getElementById("typedText");
  const cursor = document.getElementById("cursor");
  const questionText = document.getElementById("questionText");
  const reactionBar = document.getElementById("reactionBar");
  
  let i = 0;
  function type() {
    if (i < textToType.length) {
      typedTextEl.textContent += textToType.charAt(i); i++; setTimeout(type, 40);
    } else {
      cursor.style.display = "none";
      questionText.classList.add("show");
      reactionBar.classList.add("show");
    }
  }
  type();
}

/* BUTTON HANDLERS */
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const successOverlay = document.getElementById("successOverlay");

yesBtn.addEventListener("click", () => {
  confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
  successOverlay.classList.add("show");
  
  const typedSubtext = document.getElementById("typedSubtext");
  const cursorP = document.getElementById("cursorP");
  const msgBox = document.getElementById("msgBox");
  const signatureText = document.getElementById("signatureText");

  const successMessage = "Our Forever Begins Today 🥰\nI love you today tomorrow and forever ♾️✨";
  let j = 0;
  
  function typeSuccess() {
    if (j < successMessage.length) {
      typedSubtext.textContent += successMessage.charAt(j); j++; setTimeout(typeSuccess, 40);
    } else {
      cursorP.style.display = "none";
      msgBox.classList.add("show");
      signatureText.classList.add("show");
    }
  }
  typeSuccess();
});

/* NO BUTTON EVADE - NOW MOVES FREELY ACROSS ENTIRE SCREEN */
const noPhrases = ["No", "Are you sure? 🥺", "Think again! 💭", "Really? 💔", "Reconsider? 🌸", "Give it a try! ✨", "Wrong button! 😜", "Nice try! 🙈"];
let phraseIndex = 0;

noBtn.addEventListener("mouseover", moveNoBtn);
noBtn.addEventListener("touchstart", (e) => { e.preventDefault(); moveNoBtn(); });

function moveNoBtn() {
  // Check if position is not fixed yet, if so, make it fixed so it can roam anywhere
  if (noBtn.style.position !== 'fixed') {
    noBtn.style.position = 'fixed';
    noBtn.style.transform = 'none'; // reset previous translate
  }
  
  // Calculate max coordinates within screen bounds safely
  const maxX = window.innerWidth - noBtn.offsetWidth - 20;
  const maxY = window.innerHeight - noBtn.offsetHeight - 20;

  // Generate random X and Y coordinates
  const randomX = Math.max(20, Math.floor(Math.random() * maxX));
  const randomY = Math.max(20, Math.floor(Math.random() * maxY));

  noBtn.style.left = randomX + "px";
  noBtn.style.top = randomY + "px";
  
  phraseIndex = (phraseIndex + 1) % noPhrases.length;
  noBtn.textContent = noPhrases[phraseIndex];
}

/* BACKGROUND FLOATING PARTICLES */
function startBackgroundParticles() {
  setInterval(() => {
    const particle = document.createElement('div');
    particle.textContent = Math.random() > 0.5 ? '✨' : '💖';
    particle.style.position = 'fixed';
    particle.style.left = Math.random() * 100 + 'vw';
    particle.style.bottom = '-30px';
    particle.style.fontSize = (Math.random() * 12 + 10) + 'px';
    particle.style.opacity = Math.random() * 0.4 + 0.1;
    particle.style.pointerEvents = 'none';
    particle.style.zIndex = '1';
    particle.style.animation = `bgFloatParticle ${Math.random() * 4 + 5}s linear forwards`;
    
    document.body.appendChild(particle);
    setTimeout(() => particle.remove(), 9000);
  }, 600); // প্রতি ৬০০ms এ একটি করে particle বের হবে
}

/* WHATSAPP MESSAGE */
document.getElementById("sendMsgBtn").addEventListener("click", () => {
  const userMsg = document.getElementById("userMessage").value.trim();
  const text = encodeURIComponent(`Hey ${senderName}! I opened your secret letter! ❤️\n\nMy Message: ${userMsg}`);
  window.open(`https://wa.me/${myWhatsAppNumber}?text=${text}`, '_blank');
});

/* SPAM SCREEN WITH EMOJIS WHEN CLICKED */
function sendReaction(emoji) {
  // Reaction effect inside WhatsApp is removed, screen fill animation is added
  confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });

  for (let i = 0; i < 35; i++) {
    setTimeout(() => {
      const floatEmoji = document.createElement('div');
      floatEmoji.textContent = emoji;
      floatEmoji.style.position = 'fixed';
      floatEmoji.style.left = (Math.random() * 100) + 'vw';
      floatEmoji.style.bottom = '-50px';
      floatEmoji.style.fontSize = (Math.random() * 25 + 20) + 'px';
      floatEmoji.style.zIndex = '9999';
      floatEmoji.style.pointerEvents = 'none';
      floatEmoji.style.filter = 'drop-shadow(0 4px 10px rgba(0,0,0,0.4))';
      
      // Random animation duration for smooth floating effect
      floatEmoji.style.animation = `emojiFloat ${Math.random() * 2 + 2.5}s cubic-bezier(0.25, 1, 0.5, 1) forwards`;
      
      document.body.appendChild(floatEmoji);
      
      // Remove element after animation ends
      setTimeout(() => floatEmoji.remove(), 4500);
    }, i * 60); // Emojis will come out back to back
  }
}
